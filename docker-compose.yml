# Production: the app behind Caddy (HTTPS). See docs/deploy.md.
services:
  app:
    build: .
    restart: unless-stopped
    env_file: .env
    environment:
      # Fixed for the container, whatever .env says.
      HOST: 0.0.0.0
      PORT: "8080"
      DB_PATH: /app/data/gift.db
    volumes:
      - appdata:/app/data # the SQLite DB and its migration snapshots
    # No ports: only Caddy reaches the app, over the Compose network.

  caddy:
    image: caddy:2.10
    restart: unless-stopped
    depends_on: [app]
    environment:
      SITE_ADDRESS: ${SITE_ADDRESS:-santa.mangobello.dev}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
      - "${HTTPS_PORT:-443}:443/udp" # HTTP/3
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data # certificates: keep, or Let's Encrypt rate limits bite
      - caddy_config:/config

volumes:
  appdata:
  caddy_data:
  caddy_config:
