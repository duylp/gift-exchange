[project]
name = "gift-exchange"
version = "0.1.0"
description = "Secret Santa-style gift exchange web app"
readme = "README.md"
authors = [
    { name = "duylp" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "nicegui==4.0.0",
    "python-dotenv>=1.2.4",
]

[tool.hatch.build.targets.wheel]
# sqlite_migrate is standalone (no gift_exchange imports) so it can move to its own repo.
packages = ["src/gift_exchange", "src/sqlite_migrate"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "ruff>=0.17.5",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint.isort]
# Treat it as the external library it will become.
known-third-party = ["sqlite_migrate"]
